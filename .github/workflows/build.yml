name: Build Cleo TV

on:
  push:
    branches: [main]
  pull_request:          # pull requests are built too, but only main publishes a release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          # The default list includes the old "tools" package, which newer SDK managers no longer have.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Optional: your own signing key. Without these secrets the shared key in /signing is used.
      - name: Use private signing key (if set)
        env:
          KS: ${{ secrets.LUME_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "LUME_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          LUME_KEYSTORE_PASSWORD: ${{ secrets.LUME_KEYSTORE_PASSWORD }}
          LUME_KEY_ALIAS: ${{ secrets.LUME_KEY_ALIAS }}
          LUME_KEY_PASSWORD: ${{ secrets.LUME_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk cleo-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cleo-tv-1.1.${{ github.run_number }}
          path: cleo-tv.apk

      # Every build becomes the "latest" release, so this link always gets the newest APK:
      # https://github.com/<you>/<repo>/releases/latest/download/cleo-tv.apk
      - uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: build-${{ github.run_number }}
          name: Cleo TV 1.1.${{ github.run_number }}
          body: Built from ${{ github.sha }}. Install with Downloader on your Fire TV.
          files: cleo-tv.apk
          make_latest: true
